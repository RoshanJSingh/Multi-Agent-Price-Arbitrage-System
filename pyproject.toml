[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-deal-finder"
version = "0.1.0"
description = "Multi-agent price arbitrage system for e-commerce deal discovery."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Roshan J. Singh" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

